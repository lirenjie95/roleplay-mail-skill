name: 测试

on: [push, pull_request]

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 语法检查
        run: python -m py_compile scripts/config.py scripts/imap.py scripts/smtp.py install.py
      - name: 配置文件校验
        run: python -c "import json; json.load(open('service.config.json', encoding='utf-8')); json.load(open('roleplay.config.example', encoding='utf-8')); print('JSON 配置合法')"
      - name: 单元测试
        run: python -m unittest discover -s tests -v
